[project]
name = "gates-ai4s"
version = "0.1.0"
description = "Group-Aware Time-Efficient Stopping for longitudinal in-vitro experiments"
authors = [{ name = "Atharva Parande" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "plotly>=6.3,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "streamlit>=1.54,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<0.17",
]

[project.scripts]
gates = "gates.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
